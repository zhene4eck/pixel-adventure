<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Финал — Пиксельное приключение</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2aa9dc;font-family:monospace;color:#10202b}body{display:flex;align-items:center;justify-content:center;padding:14px}.panel{width:min(900px,100%);background:#fff0ae;border:7px solid #10202b;box-shadow:10px 10px #10202b;padding:24px;text-align:center;position:relative;overflow:hidden}.stars{font-size:34px;letter-spacing:20px;color:#f5b900;text-shadow:3px 3px #10202b;animation:blink 1s steps(2) infinite}@keyframes blink{50%{transform:translateY(-4px)}}h1{margin:8px 0;color:#b52b25;font-size:clamp(42px,9vw,78px);text-shadow:5px 5px #f5c85d}p{color:#2675a8;font-weight:900;font-size:18px;line-height:1.45}.trophy{margin:18px auto;width:150px;height:120px;position:relative}.trophy *{position:absolute;background:#ffd33f;border:5px solid #10202b}.cup{left:35px;top:5px;width:80px;height:65px}.stem{left:68px;top:68px;width:14px;height:25px}.base{left:42px;top:92px;width:66px;height:15px}.handleL{left:10px;top:16px;width:35px;height:42px;border-right:0}.handleR{right:10px;top:16px;width:35px;height:42px;border-left:0}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{background:#71dc39;color:#10202b;border:5px solid #10202b;box-shadow:6px 6px #10202b;padding:13px 18px;font:900 16px monospace;cursor:pointer}button:active{transform:translate(3px,3px);box-shadow:3px 3px #10202b}.small{font-size:13px;color:#b74f20}.final-image{display:block;width:min(760px,100%);max-height:58vh;object-fit:contain;margin:18px auto;border:6px solid #10202b;image-rendering:auto;box-shadow:8px 8px #10202b}.caption{font-size:clamp(20px,4vw,32px);color:#b52b25;font-weight:900;line-height:1.3;margin:10px auto 4px;text-shadow:2px 2px #f5c85d}</style></head>
<body><main class="panel"><div class="stars">★ ★ ★</div><div class="caption">Ты прошёл все испытания, поэтому заслужил этот приз!</div><img class="final-image" src="final-image.png" alt="Финальная картинка"><h1>ТЫ ПОБЕДИЛ!</h1><p>Ты прошёл все три испытания!<br>А теперь — твой заслуженный приз.</p><div class="buttons"><button onclick="location.href='index.html'">← В МЕНЮ</button><button onclick="localStorage.clear();location.href='index.html'">↻ ИГРАТЬ СНАЧАЛА</button></div><p class="small">Финал разблокируется только после прохождения всех трёх уровней.</p></main></body></html>
