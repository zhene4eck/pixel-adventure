<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пиксельное приключение</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#2aa9dc;font-family:monospace;color:#10202b}body{display:flex;justify-content:center;padding:18px}.app{width:min(900px,100%)}.panel{background:#fff0ae;border:7px solid #10202b;box-shadow:10px 10px #10202b;padding:22px;text-align:center}h1{margin:0;color:#b52b25;font-size:clamp(30px,7vw,58px);text-shadow:4px 4px #f5c85d}p{color:#2675a8;font-weight:900;line-height:1.45}.levels{display:grid;gap:14px;margin-top:22px}.level{display:flex;align-items:center;gap:14px;text-align:left;padding:13px;background:#f6d77b;border:5px solid #10202b;box-shadow:5px 5px #10202b;text-decoration:none;color:#10202b;font-weight:900}.level.locked{opacity:.45;pointer-events:none;filter:grayscale(.6)}.num{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#71dc39;border:4px solid #10202b;flex:none;font-size:22px}.icon{width:84px;height:56px;display:flex;align-items:center;justify-content:center;background:#79d7ff;border:4px solid #10202b;flex:none}.icon svg{width:76px;height:50px;shape-rendering:crispEdges}.text{line-height:1.2}.status{margin-left:auto;font-size:11px;white-space:nowrap}.final{background:#ffd33f}.reset{margin-top:18px;background:#fff0ae;border:4px solid #10202b;padding:9px 14px;font:900 13px monospace}@media(max-width:600px){body{padding:8px}.panel{padding:16px}.level{font-size:13px;padding:10px}.icon{width:66px;height:50px}.icon svg{width:60px}.status{font-size:9px}.num{width:38px;height:38px}}</style></head><body><main class="app"><section class="panel"><h1>ПИКСЕЛЬНОЕ ПРИКЛЮЧЕНИЕ</h1><p>Три самостоятельные игры.<br>Пройди их по порядку и открой финал!</p><div class="levels">
